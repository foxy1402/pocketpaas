{{template "layout" .}}

{{define "title"}}Deploy Progress — pocketpaas{{end}}
{{define "nav-portability"}}active{{end}}

{{define "content"}}
<div class="container page">
  <div class="page-header">
    <div class="d-flex align-center gap-3">
      <h1 class="page-title">Sequential Deploy</h1>
      <span id="deploy-status-badge" class="badge badge-pulling">running</span>
    </div>
  </div>

  <div style="max-width:760px">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Progress Log</span>
        <span id="live-dot" class="text-muted" style="font-size:11px">● live</span>
      </div>
      <div class="log-toolbar">
        <label>
          <input type="checkbox" checked onchange="setAutoScroll(this.checked)"> Auto-scroll
        </label>
      </div>
      <div
        class="log-viewer"
        id="deploy-log"
        style="min-height:300px;max-height:70vh"
      ></div>
    </div>

    <div id="deploy-done-banner" style="display:none" class="card mt-3">
      <div class="card-body" style="display:flex;align-items:center;gap:16px">
        <span style="font-size:22px">🎉</span>
        <div>
          <div style="font-weight:600;margin-bottom:4px">Deployment complete!</div>
          <div style="font-size:13px;color:var(--muted)">All apps have been pulled, started, and their caches pruned.</div>
        </div>
        <a href="/" class="btn btn-primary" style="margin-left:auto">Go to Dashboard →</a>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const dl = document.getElementById('deploy-log');
  if (!dl) return;
  const src = new EventSource('/portability/deploy-stream');

  var doneFired = false;
  function markDone(final) {
    if (doneFired) return;   // idempotent — watchdog and 'done' event can both fire
    doneFired = true;
    src.close();
    const badge = document.getElementById('deploy-status-badge');
    const dot   = document.getElementById('live-dot');
    const banner = document.getElementById('deploy-done-banner');
    if (dot) dot.style.display = 'none';
    if (final) {
      // Server confirmed completion via the 'done' event.
      if (badge)  { badge.textContent = 'done'; badge.className = 'badge badge-stopped'; }
      if (banner) banner.style.display = '';
    } else {
      // Watchdog tripped — connection died without a completion signal.
      if (badge)  { badge.textContent = 'connection lost'; badge.className = 'badge badge-error'; }
      showToast('Lost connection to deploy stream — check the dashboard for final state.', 'error');
    }
  }

  var lastEvent = Date.now();
  src.addEventListener('done', function() { lastEvent = Date.now(); markDone(true); });

  src.onmessage = function(e) {
    lastEvent = Date.now();
    const line = document.createElement('span');
    line.className = 'log-line';
    line.textContent = e.data;
    dl.appendChild(line);
    window.scrollLog();
  };
  // Server keepalive pings are real events (not comments) — they reset the
  // watchdog, so a long-but-healthy download never falsely trips it.
  src.addEventListener('ping', function() { lastEvent = Date.now(); });
  // EventSource auto-reconnects on transient drops; the watchdog below only
  // fires if even those keepalives stop arriving.

  // Watchdog: if no data arrives for 90 s (over 4 missed server pings) the
  // connection is silently dead.
  setInterval(function() {
    if (!doneFired && Date.now() - lastEvent > 90000) {
      markDone(false);
    }
  }, 10000);
})();
</script>
{{end}}
